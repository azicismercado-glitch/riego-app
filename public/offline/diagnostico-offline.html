<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico de Riego — Carga sin conexión</title>
<style>
:root{
  --paper:#F7F5EE; --card:#FFFFFF; --ink:#1F2A1C;
  --green:#2F5238; --green-dark:#16261B; --green-mid:#3E6B4A; --green-light:#E3ECDF;
  --clay:#9C6B42; --clay-light:#F2E7D9;
  --border:#DCD6C6; --hair:#E9E4D6;
  --success:#3F7D4F; --success-bg:#E4F0E3;
  --warn:#B0762B; --warn-bg:#F7ECD8;
  --danger:#A34A2E; --danger-bg:#F6E4DC;
  --lock:#8B8578; --lock-bg:#EFEDE6;
  --serif:Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--paper); color:var(--ink); font-size:14px;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:13px;}
.app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--card); box-shadow:0 0 28px rgba(31,42,28,0.08); display:flex; flex-direction:column; padding-bottom:24px;}
.topbar{background:var(--green-dark); color:#fff; padding:14px 18px 12px; position:sticky; top:0; z-index:5;}
.topbar .brand{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px;}
.topbar h1{font-family:var(--serif); font-size:16px; font-weight:700; margin:0;}
.topbar .prog{font-size:9px; color:#A9BCA4; text-transform:uppercase; letter-spacing:.7px; font-weight:700; display:block; margin-top:1px;}
.topbar .btn-nuevo{background:none; border:1px solid rgba(255,255,255,0.3); color:#fff; font-size:10px; font-weight:700; padding:6px 10px; border-radius:7px; white-space:nowrap;}
.offline-note{font-size:10.5px; color:#C9D6C4; line-height:1.4;}
.savebadge{font-size:9.5px; color:#A9BCA4; margin-top:4px;}
.tabs{display:flex; flex-wrap:wrap; gap:2px; background:var(--green); padding:0 8px;}
.tabs button{flex:0 0 auto; background:none; border:none; color:#D9E4D5; font-size:11px; font-weight:700; padding:10px 11px; border-bottom:3px solid transparent; white-space:nowrap;}
.tabs button.active{color:#fff; border-bottom-color:var(--clay-light);}
.content{padding:14px 16px 30px;}
.section-card{background:var(--card); border:1px solid var(--border); border-radius:13px; padding:14px 14px 16px; margin-bottom:14px;}
.section-title{font-family:var(--serif); font-weight:700; color:var(--green-dark); font-size:14px; margin:0 0 10px;}
.subsection-title{font-weight:700; color:var(--clay); font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; margin:16px 0 8px;}
.field-group{margin-bottom:11px;}
.field-group label{display:block; font-size:11px; font-weight:600; color:var(--ink); margin-bottom:4px;}
.field-group .req{color:var(--danger);}
.field-group input[type=text],.field-group input[type=number],.field-group select,.field-group textarea{
  width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--ink);
}
.field-group textarea{min-height:64px; resize:vertical;}
.hint{font-size:10.5px; color:var(--lock); margin-top:3px; line-height:1.4;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media (max-width:420px){ .row2{grid-template-columns:1fr;} }
.chip-group{display:flex; flex-wrap:wrap; gap:6px;}
.chip{border:1px solid var(--border); border-radius:20px; padding:6px 12px; font-size:11px; font-weight:600; color:var(--ink); background:#fff; user-select:none;}
.chip.selected{background:var(--green); border-color:var(--green); color:#fff;}
.table-scroll{overflow-x:auto; margin-bottom:8px;}
.dyn-table{border-collapse:collapse; width:100%; min-width:640px;}
.dyn-table th{font-size:10px; text-transform:uppercase; letter-spacing:.3px; color:var(--lock); text-align:left; padding:0 6px 6px; border-bottom:1px solid var(--border);}
.dyn-table td{padding:4px 6px; vertical-align:top; border-bottom:1px solid var(--hair);}
.dyn-table input,.dyn-table select{padding:6px 7px; font-size:11px; border:1px solid var(--border); border-radius:6px; width:100%;}
.row-remove button{background:var(--danger-bg); color:var(--danger); border:none; border-radius:6px; width:26px; height:26px; font-weight:700;}
.add-row-btn{background:var(--clay-light); color:var(--clay); border:none; border-radius:8px; padding:8px 12px; font-size:11px; font-weight:700; margin-bottom:6px;}
.photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.photo-slot{position:relative; aspect-ratio:1; border:2px dashed var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--paper); font-size:22px; color:var(--lock);}
.photo-slot input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.photo-slot img{width:100%; height:100%; object-fit:cover;}
.photo-slot .rm{position:absolute; top:4px; right:4px; background:rgba(20,20,20,0.65); color:#fff; border:none; border-radius:6px; width:22px; height:22px; font-size:12px; line-height:1;}
.photo-slot .st{position:absolute; bottom:3px; left:3px; right:3px; font-size:8.5px; color:#fff; background:rgba(20,20,20,0.55); border-radius:4px; padding:2px 4px; text-align:center;}
.nav-row{display:flex; justify-content:space-between; margin-top:6px;}
.nav-btn{background:var(--clay-light); color:var(--clay); border:none; border-radius:9px; padding:9px 14px; font-size:11.5px; font-weight:700;}
.nav-btn.primary{background:var(--green); color:#fff;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.stat-card{border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--paper);}
.stat-value{font-family:var(--serif); font-size:22px; font-weight:700; color:var(--green-dark);}
.stat-label{font-size:10px; color:var(--lock); margin-top:2px;}
.check-list{list-style:none; margin:0; padding:0;}
.check-list li{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--hair); font-size:11.5px;}
.check-list li:last-child{border-bottom:none;}
details summary{cursor:pointer; font-weight:700; font-size:12.5px; color:var(--green); list-style:none; display:flex; align-items:center; gap:6px;}
details summary::-webkit-details-marker{display:none;}
details summary::before{content:"▸"; font-size:10px;}
details[open] summary::before{content:"▾";}
details summary:focus-visible{outline:2px solid var(--green); outline-offset:3px; border-radius:4px;}
.resumen-completo{margin-top:12px; max-height:340px; overflow-y:auto; border-top:1px solid var(--hair); padding-top:6px;}
.kv-row{font-size:11.5px; line-height:1.5; padding:5px 0; border-bottom:1px solid var(--hair);}
.kv-row:last-child{border-bottom:none;}
.kv-row b{color:var(--green-dark);}
.dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
.dot.ok{background:var(--success);}
.dot.part{background:var(--warn);}
.dot.no{background:var(--lock);}
.export-btn{width:100%; background:var(--green); color:#fff; border:none; border-radius:11px; padding:15px; font-size:13.5px; font-weight:700; margin-top:6px;}
.export-btn:disabled{opacity:.5;}
.toast{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--green-dark); color:#fff; padding:10px 16px; border-radius:10px; font-size:12px; box-shadow:0 6px 18px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; max-width:90%; text-align:center;}
.toast.show{opacity:1;}
.footer-note{text-align:center; font-size:9.5px; color:var(--lock); padding:14px 20px 4px;}
.intro-banner{background:var(--clay-light); border:1px solid var(--clay); color:var(--ink); border-radius:10px; padding:10px 12px; font-size:11px; line-height:1.5; margin:12px 16px 0;}
.badge-count{background:rgba(255,255,255,0.16); color:#fff; font-size:9px; font-weight:700; border-radius:10px; padding:1px 6px; margin-left:5px;}
</style>
</head>

/* ================= fotos: compresión local + geolocalización best-effort ================= */
function fileToCompressedDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}
function getGeo(){
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve({ str:'Sin geolocalización (no soportada)', lat:null, lng:null });
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ str:`Lat ${pos.coords.latitude.toFixed(4)}, Long ${pos.coords.longitude.toFixed(4)}`, lat:pos.coords.latitude, lng:pos.coords.longitude }),
      () => resolve({ str:'Sin geolocalización (permiso denegado o sin señal GPS)', lat:null, lng:null }),
      { timeout: 8000 }
    );
  });
}
async function onFotoSelected(slotIndex, input){
  const file = input.files && input.files[0];
  if (!file) return;
  showToast('Procesando foto…');
  try {
    const dataUrl = await fileToCompressedDataUrl(file, 1600, 0.72);
    const geo = await getGeo();
    state.fotos[slotIndex] = { dataUrl, mimetype:'image/jpeg', lat:geo.lat, lng:geo.lng, geoStr:geo.str };
    scheduleSave();
    showToast('Foto cargada');
  } catch(e) {
    showToast('No se pudo procesar la foto: ' + (e.message||e), true);
  }
  input.value = '';
  render();
}

/* ================= completitud (misma lógica que usa la app real) ================= */
function sistemasRiego(dd){
  const sp = dd.sistemasPresentes || [];
  return {
    superficial: sp.some((s) => ['Surcos', 'Melgas'].includes(s)),
    presurizado: sp.some((s) => ['Goteo', 'Aspersión'].includes(s))
  };
}
function completeness(data, fotosCount){
  const dd = data;
  const { superficial, presurizado } = sistemasRiego(dd);
  const noRiega = dd.tipoRiegoGeneral === 'No riega';
  const riegoReq = [noRiega || (dd.sistemasPresentes || []).length > 0];
  if (superficial) riegoReq.push(has(dd.rsSuperficie), has(dd.rsFrecTurnado), has(dd.rsDuracionTurnado));
  if (presurizado) riegoReq.push(has(dd.rpSuperficie), has(dd.rpFrecuencia), has(dd.rpDuracion));
  if (!superficial && !presurizado && !noRiega) riegoReq.push(has(dd.rsSuperficie) || has(dd.rpSuperficie));
  const secs = {
    estab: { label:'Establecimiento', req:[has(dd.productor),has(dd.finca),has(dd.localidad),has(dd.renspa),has(dd.superficieTotal),has(dd.superficieCultivada)] },
    cultivos: { label:'Cultivos', req:[(dd.cultivos||[]).some(c=>has(c.cultivo)&&has(c.superficie))] },
    suelo: { label:'Suelo', req:[has(dd.analisisSuelo),has(dd.textura)] },
    riego: { label:'Sistema de riego', req:riegoReq },
    propuesta: { label:'Propuesta de mejora', req:[has(dd.descripcionMejora),(dd.materiales||[]).some(m=>has(m.item)),(dd.indicadores||[]).some(i=>has(i.actual)||has(i.proyectada)),has(dd.tiempoTotalMeses),(dd.presupuesto||[]).some(p=>has(p.inversion)&&has(p.monto))] },
    fotos: { label:'Fotos', req:[(fotosCount||0)>0] }
  };
  let done=0, total=0; const detail=[];
  for (const k in secs){
    const ok = secs[k].req.filter(Boolean).length;
    const t = secs[k].req.length;
    const state2 = ok===t ? 'ok' : ok>0 ? 'part' : 'no';
    detail.push({ label:secs[k].label, ok, total:t, state:state2 });
    done+=ok; total+=t;
  }
  return { pct: total ? Math.round(done/total*100) : 0, detail };
}

function slug(s){

    data: state.data,
    fotos: Object.keys(state.fotos).map((slotIndex) => ({
      slotIndex: Number(slotIndex),
      dataUrl: state.fotos[slotIndex].dataUrl,
      mimetype: state.fotos[slotIndex].mimetype,
      lat: state.fotos[slotIndex].lat,
      lng: state.fotos[slotIndex].lng
    }))
  };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const base = slug(state.data.finca || state.data.productor) || 'sin-nombre';
  const stamp = new Date().toISOString().replace(/[:T]/g,'-').slice(0,16);
  a.href = url;
  a.download = `diagnostico_${base}_${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Archivo generado. Buscalo en Descargas.');
}

/* ================= toast ================= */
let toastTimer = null;
function showToast(msg, isError){
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg || '';
  t.style.background = isError ? 'var(--danger)' : 'var(--green-dark)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ================= render ================= */
function chip(curVal, value, label, key){
  const sel = curVal===value;
  return `<div class="chip ${sel?'selected':''}" onclick="setFieldR('${key}','${value.replace(/'/g,"\\'")}')">${label}</div>`;
}
function chipMulti(arr, value, label, key){
  const sel = (arr||[]).includes(value);
  return `<div class="chip ${sel?'selected':''}" onclick="toggleArr('${key}','${value.replace(/'/g,"\\'")}')">${label}</div>`;
}
// Grupo de chips de selección múltiple a partir de una lista completa —
// evita repetir el .map(...).join('') en cada lista nueva del rediseño.
function chipMultiList(list, key, dd){
  return `<div class="chip-group">${list.map(v=>chipMulti(dd[key], v, v, key)).join('')}</div>`;
}
function selectHTML(list, key, dd){
  return `<select onchange="setFieldR('${key}',this.value)">
    <option value="">Elegir…</option>
    ${list.map(o=>`<option value="${o}" ${dd[key]===o?'selected':''}>${o}</option>`).join('')}
  </select>`;
}

      <div class="section-title">Generar archivo para importar</div>
      <div class="hint" style="margin-bottom:10px">Se genera un archivo <b>.json</b> con todo lo cargado (datos + fotos). Guardalo, y cuando tengas conexión entrá a la app → botón <b>"Importar diagnóstico"</b> → elegí este archivo.</div>
      <div class="field-group"><label>Vista previa</label>
        <div class="hint"><b>${dd.productor||'(sin productor)'}</b> — ${dd.finca||'(sin finca)'} · ${dd.localidad||'(sin localidad)'}</div>
      </div>
      <button class="export-btn" onclick="exportarArchivo()">Generar y descargar archivo (.json)</button>
    </div>
    ${navRow()}`;
  }

  return '';
}

render();
</script>
</body>
</html>
