services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: riego
      POSTGRES_PASSWORD: riego
      POSTGRES_DB: riego
    ports:
      - "5432:5432"
    volumes:
      - riego_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riego -d riego"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  riego_pg_data:
